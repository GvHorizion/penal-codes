  { code: "(7).05", name: "Possession of a Stolen Weapon", type: "Felony", jail: "90s", keywords: "gun" },
  { code: "(7).06", name: "Unlawful Distribution of a Firearm", type: "Felony", jail: "90s", keywords: "gun" },

  // Section 8: Crimes Against Public Health and Safety
  { code: "(8).01", name: "Possession of a Controlled Substance", type: "Misdemeanor", fine: "$1,000", jail: "60s", keywords: "drugs" },
  { code: "(8).02", name: "Possession of a Controlled Substance with Intent to Sell", type: "Felony", fine: "$20,000", jail: "120s", keywords: "drugs dealing" },
  { code: "(8).03", name: "Possession of Drug Paraphernalia", type: "Misdemeanor", fine: "$1,000", jail: "60s" },
  { code: "(8).04", name: "Maintaining a Place for the Purpose of Distribution", type: "Felony", fine: "$10,000", jail: "90s", keywords: "drug house" },
  { code: "(8).05", name: "Manufacture of a Controlled Substance", type: "Felony", fine: "$50,000", jail: "180s", keywords: "drugs" },
  { code: "(8).06", name: "Sale of a Controlled Substance", type: "Felony", fine: "$5,000", jail: "180s", keywords: "drugs dealing" },
  { code: "(8).07", name: "Under the Influence of a Controlled Substance", type: "Felony", fine: "$2,000", jail: "180s", keywords: "drugs high" },
  { code: "(8).08", name: "Detention of Mentally Disordered Persons", type: "Misdemeanor", jail: "180s" },
  { code: "(8).09", name: "Possession of Marijuana", type: "Felony", fine: "$5,000", jail: "180s", keywords: "weed cannabis" },

  // Section 9: Crimes Against State Dependents
  { code: "(9).01", name: "Animal Abuse/Cruelty", type: "Felony", fine: "$20,000", jail: "90s" },
  { code: "(9).02", name: "Sale of Alcohol to a Minor", type: "Misdemeanor", fine: "$3,000" },
  { code: "(9).03", name: "Minor Alcohol Violation", type: "Misdemeanor", fine: "$1,000" },
  { code: "(9).04", name: "Child Endangerment", type: "Misdemeanor", fine: "$10,000", jail: "60s" }
];

/* =====================================================================
   DISPLAY LOGIC: no need to edit below this line
   ===================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const norm = s => String(s ?? "").toLowerCase().replace(/[^a-z0-9$ ]/g, "");

const state = { q: "", cat: "all", cls: "all" };

function catId(e) {
  if (e.category != null) return Number(e.category);
  const m = /^\s*\(?(\d+)\)?/.exec(e.code || "");
  return m ? Number(m[1]) : 0;
}
function sortKey(code) {
  return String(code).replace(/\d+/g, n => n.padStart(4, "0"));
}
const ENTRIES = PENAL_CODES.map(e => ({
  ...e, _cat: catId(e),
  _hay: norm([e.code, e.name, e.type, e.fine, e.jail, e.keywords,
    e.impound === true ? "impound impoundment" : e.impound,
    e.suspension === true ? "suspension suspended license" : e.suspension].join(" "))
})).sort((a, b) => sortKey(a.code).localeCompare(sortKey(b.code)));

// Any entry whose category isn't listed gets its own "Other" group
const knownIds = new Set(CATEGORIES.map(c => c.id));
const CATS = CATEGORIES.slice();
ENTRIES.forEach(e => { if (!knownIds.has(e._cat)) { knownIds.add(e._cat); CATS.push({ id: e._cat, name: "Other Codes" }); } });

function matches(e) {
  if (state.cat !== "all" && e._cat !== state.cat) return false;
  if (state.cls !== "all" && (e.type || "").toLowerCase() !== state.cls) return false;
  const terms = norm(state.q).split(/\s+/).filter(Boolean);
  return terms.every(t => e._hay.includes(t));
}

function typeTag(type) {
  if (!type) return '<span class="none">—</span>';
  const k = type.toLowerCase();
  const cls = k === "felony" ? "t-felony" : k === "misdemeanor" ? "t-misdemeanor" : k === "citation" ? "t-citation" : "t-other";
  return `<span class="tag ${cls}">${esc(type)}</span>`;
}
function flag(v) {
  if (v === true) return '<span class="yes">Yes</span>';
  if (!v) return '<span class="none">—</span>';
  return `<span class="yes">${esc(v)}</span>`;
}
function plain(v) { return v ? esc(v) : '<span class="none">—</span>'; }

function buildNav() {
  const counts = { all: ENTRIES.length };
  ENTRIES.forEach(e => counts[e._cat] = (counts[e._cat] || 0) + 1);
  const items = [{ id: "all", name: "All categories" }, ...CATS];
  $("nav").innerHTML = items.map(c =>
    `<button type="button" data-cat="${c.id}" class="${String(state.cat) === String(c.id) ? "active" : ""}">
      <span>${c.id === "all" ? "" : "Section " + c.id + ": "}${esc(c.name)}</span><span class="n">${counts[c.id] || 0}</span></button>`).join("");
}

function buildClassFilter() {
  const types = [...new Set(ENTRIES.map(e => e.type).filter(Boolean))];
  $("cls").innerHTML = '<option value="all">All classifications</option>' +
    types.map(t => `<option value="${esc(t.toLowerCase())}">${esc(t)}</option>`).join("");
}

function render() {
  const list = ENTRIES.filter(matches);
  const filtering = state.q.trim() || state.cat !== "all" || state.cls !== "all";
  $("counter").innerHTML = `<b>${list.length}</b> of ${ENTRIES.length} codes`;
  $("reset").hidden = !filtering;
  buildNav();

  if (!list.length) {
    $("results").innerHTML = `<div class="no-results"><h3>No penal codes found</h3>
      <p>Nothing matches your search. Check the spelling, try a shorter keyword, or search by code number.</p>
      <button type="button" id="clear2">Clear filters</button></div>`;
    $("clear2").onclick = clearAll;
    return;
  }

  $("results").innerHTML = CATS.map(c => {
    const rows = list.filter(e => e._cat === c.id);
    if (!rows.length && (filtering || state.cat !== "all")) return "";
    const body = rows.length ? `<div class="scroll"><table>
      <thead><tr><th>Code</th><th>Offense</th><th>Classification</th><th>Fine</th><th>Jail time</th><th>Impound</th><th>License suspension</th></tr></thead>
      <tbody>${rows.map(e => `<tr>
        <td class="code" data-label="Code">${esc(e.code)}</td>
        <td class="name" data-label="Offense">${esc(e.name)}</td>
        <td data-label="Classification">${typeTag(e.type)}</td>
        <td data-label="Fine">${plain(e.fine)}</td>
        <td data-label="Jail time">${plain(e.jail)}</td>
        <td data-label="Impound">${flag(e.impound)}</td>
        <td data-label="License suspension">${flag(e.suspension)}</td></tr>`).join("")}</tbody></table></div>`
      : '<div class="empty-cat">No codes in this category yet.</div>';
    return `<section class="cat" id="cat-${c.id}"><div class="cat-head">
      <h2>Section ${c.id}: ${esc(c.name)}</h2><small>${rows.length} ${rows.length === 1 ? "code" : "codes"}</small></div>${body}</section>`;
  }).join("");
}

function clearAll() {
  state.q = ""; state.cat = "all"; state.cls = "all";
  $("q").value = ""; $("cls").value = "all";
  render();
}

$("q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("cls").addEventListener("change", e => { state.cls = e.target.value; render(); });
$("reset").addEventListener("click", clearAll);
$("nav").addEventListener("click", e => {
  const b = e.target.closest("button[data-cat]");
  if (!b) return;
  state.cat = b.dataset.cat === "all" ? "all" : Number(b.dataset.cat);
  render();
  const target = state.cat === "all" ? document.querySelector(".layout") : $("cat-" + state.cat);
  if (target) target.scrollIntoView({ block: "start" });
});

buildClassFilter();
render();
</script>
</body>
</html>
