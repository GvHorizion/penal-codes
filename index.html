<style>
:root{
  --accent:#029FFC; --accent-soft:rgba(2,159,252,.14); --accent-line:rgba(2,159,252,.45);
  --bg:#0a0e14; --panel:#111823; --panel-2:#16202e; --line:#243247;
  --text:#e8eef7; --muted:#8ea0b8;
  --felony:#ff6b7a; --misd:#ffb454; --cite:#5fd0a0; --other:#b69cff;
  --radius:12px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
.top{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0e1520,var(--bg))}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
.hero{padding:40px 0 28px}
.hero h1{margin:0 0 6px;font-size:clamp(1.8rem,4vw,2.8rem);font-weight:700;letter-spacing:-.02em}
.hero h1 span{color:var(--accent)}
.hero p{margin:0;color:var(--muted);max-width:60ch}

/* Controls */
.controls{position:sticky;top:0;z-index:20;background:rgba(10,14,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.controls .wrap{display:flex;gap:12px;align-items:center;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
.search{position:relative;flex:1 1 320px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
input[type=search],select{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;font-size:1rem}
input[type=search]{padding-left:42px}
input[type=search]::placeholder{color:#62738b}
input[type=search]:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
select{width:auto;min-width:170px;cursor:pointer}
.counter{color:var(--muted);font-size:.92rem;white-space:nowrap}
.counter b{color:var(--text)}
.reset{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:11px 14px;font:inherit;cursor:pointer}
.reset:hover{color:var(--text);border-color:var(--accent-line)}

/* Layout */
.layout{display:grid;grid-template-columns:260px 1fr;gap:28px;padding-top:24px;padding-bottom:64px;align-items:start}
.nav{position:sticky;top:84px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:8px;max-height:calc(100vh - 104px);overflow:auto}
.nav button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--muted);font:inherit;font-size:.95rem;padding:9px 12px;border-radius:8px;cursor:pointer}
.nav button:hover{background:var(--panel-2);color:var(--text)}
.nav button.active{background:var(--accent-soft);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.nav .n{color:var(--muted);font-variant-numeric:tabular-nums}
.nav button.active .n{color:var(--accent)}

/* Sections */
.cat{margin-bottom:28px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.cat-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,var(--accent-soft),transparent 70%)}
.cat-head h2{margin:0;font-size:1.25rem;font-weight:600}
.cat-head small{color:var(--muted)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:860px}
th{font-weight:500;color:var(--muted);font-size:.85rem;text-align:left;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel-2);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid #1a2535;vertical-align:top;font-size:.96rem}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#142031}
td.code{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600;white-space:nowrap}
td.name{font-weight:500}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.82rem;font-weight:500;border:1px solid}
.t-felony{color:var(--felony);border-color:rgba(255,107,122,.4);background:rgba(255,107,122,.1)}
.t-misdemeanor{color:var(--misd);border-color:rgba(255,180,84,.4);background:rgba(255,180,84,.1)}
.t-citation{color:var(--cite);border-color:rgba(95,208,160,.4);background:rgba(95,208,160,.1)}
.t-other{color:var(--other);border-color:rgba(182,156,255,.4);background:rgba(182,156,255,.1)}
.none{color:#4d5d73}
.yes{color:var(--text)}
.empty-cat{padding:20px;color:var(--muted)}

.no-results{text-align:center;padding:64px 20px;background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius)}
.no-results h3{margin:0 0 6px;font-size:1.3rem}
.no-results p{margin:0 0 16px;color:var(--muted)}
.no-results button{background:var(--accent);color:#04121c;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:.88rem;padding:24px 0}
[hidden]{display:none!important}

/* Tablet */
@media (max-width:960px){
  .layout{grid-template-columns:1fr}
  .nav{position:static;display:flex;gap:6px;overflow-x:auto;max-height:none;padding:8px;scrollbar-width:thin}
  .nav button{width:auto;white-space:nowrap;flex:0 0 auto;border:1px solid var(--line)}
  .nav button.active{box-shadow:none;border-color:var(--accent)}
}
/* Mobile: rows become stacked cards */
@media (max-width:700px){
  .wrap{padding:0 14px}
  .hero{padding:28px 0 20px}
  .controls .wrap>*{flex:1 1 100%}
  select{width:100%}
  table,thead,tbody,tr,td{display:block;min-width:0}
  thead{display:none}
  tr{padding:12px 14px;border-bottom:1px solid #1a2535}
  tbody tr:last-child{border-bottom:0}
  td{border:0;padding:3px 0;display:flex;justify-content:space-between;gap:16px}
  td::before{content:attr(data-label);color:var(--muted);font-size:.85rem;flex:0 0 auto}
  td.code{font-size:1rem}
  td.name{font-size:1.02rem}
  td.empty-field{display:none}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

      <input id="q" type="search" placeholder="Search by code, offense, or keyword (e.g. (6).21, burglary, DUI)" autocomplete="off" aria-label="Search penal codes">

/* =====================================================================
   DISPLAY LOGIC: no need to edit below this line
   ===================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const norm = s => String(s ?? "").toLowerCase().replace(/[^a-z0-9$ ]/g, "");

const state = { q: "", cat: "all", cls: "all" };

function catId(e) {
  if (e.category != null) return Number(e.category);
  const m = /^\s*\(?(\d+)\)?/.exec(e.code || "");
  return m ? Number(m[1]) : 0;
}
function sortKey(code) {
  return String(code).replace(/\d+/g, n => n.padStart(4, "0"));
}
const ENTRIES = PENAL_CODES.map(e => ({
  ...e, _cat: catId(e),
  _hay: norm([e.code, e.name, e.type, e.fine, e.jail, e.keywords,
    e.impound === true ? "impound impoundment" : e.impound,
    e.suspension === true ? "suspension suspended license" : e.suspension].join(" "))
})).sort((a, b) => sortKey(a.code).localeCompare(sortKey(b.code)));

// Any entry whose category isn't listed gets its own "Other" group
const knownIds = new Set(CATEGORIES.map(c => c.id));
const CATS = CATEGORIES.slice();
ENTRIES.forEach(e => { if (!knownIds.has(e._cat)) { knownIds.add(e._cat); CATS.push({ id: e._cat, name: "Other Codes" }); } });

function matches(e) {
  if (state.cat !== "all" && e._cat !== state.cat) return false;
  if (state.cls !== "all" && (e.type || "").toLowerCase() !== state.cls) return false;
  const terms = norm(state.q).split(/\s+/).filter(Boolean);
  return terms.every(t => e._hay.includes(t));
}

function typeTag(type) {
  if (!type) return '<span class="none">—</span>';
  const k = type.toLowerCase();
  const cls = k === "felony" ? "t-felony" : k === "misdemeanor" ? "t-misdemeanor" : k === "citation" ? "t-citation" : "t-other";
  return `<span class="tag ${cls}">${esc(type)}</span>`;
}
function flag(v) {
  if (v === true) return '<span class="yes">Yes</span>';
  if (!v) return '<span class="none">—</span>';
  return `<span class="yes">${esc(v)}</span>`;
}
function plain(v) { return v ? esc(v) : '<span class="none">—</span>'; }

function buildNav() {
  const counts = { all: ENTRIES.length };
  ENTRIES.forEach(e => counts[e._cat] = (counts[e._cat] || 0) + 1);
  const items = [{ id: "all", name: "All categories" }, ...CATS];
  $("nav").innerHTML = items.map(c =>
    `<button type="button" data-cat="${c.id}" class="${String(state.cat) === String(c.id) ? "active" : ""}">
      <span>${c.id === "all" ? "" : "Section " + c.id + ": "}${esc(c.name)}</span><span class="n">${counts[c.id] || 0}</span></button>`).join("");
}

function buildClassFilter() {
  const types = [...new Set(ENTRIES.map(e => e.type).filter(Boolean))];
  $("cls").innerHTML = '<option value="all">All classifications</option>' +
    types.map(t => `<option value="${esc(t.toLowerCase())}">${esc(t)}</option>`).join("");
}

function render() {
  const list = ENTRIES.filter(matches);
  const filtering = state.q.trim() || state.cat !== "all" || state.cls !== "all";
  $("counter").innerHTML = `<b>${list.length}</b> of ${ENTRIES.length} codes`;
  $("reset").hidden = !filtering;
  buildNav();

  if (!list.length) {
    $("results").innerHTML = `<div class="no-results"><h3>No penal codes found</h3>
      <p>Nothing matches your search. Check the spelling, try a shorter keyword, or search by code number.</p>
      <button type="button" id="clear2">Clear filters</button></div>`;
    $("clear2").onclick = clearAll;
    return;
  }

  $("results").innerHTML = CATS.map(c => {
    const rows = list.filter(e => e._cat === c.id);
    if (!rows.length && (filtering || state.cat !== "all")) return "";
    const body = rows.length ? `<div class="scroll"><table>
      <thead><tr><th>Code</th><th>Offense</th><th>Classification</th><th>Fine</th><th>Jail time</th><th>Impound</th><th>License suspension</th></tr></thead>
      <tbody>${rows.map(e => `<tr>
        <td class="code" data-label="Code">${esc(e.code)}</td>
        <td class="name" data-label="Offense">${esc(e.name)}</td>
        <td data-label="Classification">${typeTag(e.type)}</td>
        <td data-label="Fine">${plain(e.fine)}</td>
        <td data-label="Jail time">${plain(e.jail)}</td>
        <td data-label="Impound">${flag(e.impound)}</td>
        <td data-label="License suspension">${flag(e.suspension)}</td></tr>`).join("")}</tbody></table></div>`
      : '<div class="empty-cat">No codes in this category yet.</div>';
    return `<section class="cat" id="cat-${c.id}"><div class="cat-head">
      <h2>Section ${c.id}: ${esc(c.name)}</h2><small>${rows.length} ${rows.length === 1 ? "code" : "codes"}</small></div>${body}</section>`;
  }).join("");
}

function clearAll() {
  state.q = ""; state.cat = "all"; state.cls = "all";
  $("q").value = ""; $("cls").value = "all";
  render();
}

$("q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("cls").addEventListener("change", e => { state.cls = e.target.value; render(); });
$("reset").addEventListener("click", clearAll);
$("nav").addEventListener("click", e => {
  const b = e.target.closest("button[data-cat]");
  if (!b) return;
  state.cat = b.dataset.cat === "all" ? "all" : Number(b.dataset.cat);
  render();
  const target = state.cat === "all" ? document.querySelector(".layout") : $("cat-" + state.cat);
  if (target) target.scrollIntoView({ block: "start" });
});

buildClassFilter();
render();
</script>
